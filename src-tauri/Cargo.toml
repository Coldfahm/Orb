[package]
name = "orb-desktop-assistant"
version = "0.1.0"
description = "Lightweight, always-on-top, shape-shifting desktop assistant widget"
authors = ["Orb Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "shell-execute", "fs-read-file", "fs-read-dir", "clipboard-all", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rdev = "0.5.3"
sysinfo = "0.30"
arboard = "3.3"
tokio = { version = "1", features = ["full"] }
open = "5.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
